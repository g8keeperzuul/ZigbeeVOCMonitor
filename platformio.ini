; PlatformIO Project Configuration File
;
; ESP32-C6 Zigbee On/Off Light -- joins an existing coordinator as a Router.
; The LED is the onboard addressable WS2812 on GPIO 8.
;
;   pio run -t upload -t monitor
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c6-devkitc-1]
platform = espressif32 @ ^6.6.0
board = esp32-c6-devkitc-1
framework = espidf
; The board manifest assumes 8 MB; this board actually has 16 MB.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp_idf_exception_decoder, direct
